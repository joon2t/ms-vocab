<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말레이어 단어장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말레이어">
<meta name="theme-color" content="#1E6E6A">
<script>
  // 선택: Firebase 동기화 주소를 여기에 넣으면 모든 기기에서 자동으로 연결됩니다.
  // (파일을 공개 저장소에 올린다면 비워 두고, 설정 화면에서 연결하세요.)
  window.SYNC_URL_DEFAULT = "";
</script>
<style>
  :root{
    --paper:#EEF1F1;
    --white:#FFFFFF;
    --ink:#1E2433;
    --ink-2:#5B6475;
    --ink-3:#8A93A3;
    --line:#D9DEDE;
    --rule:#CFE0DE;
    --teal:#1E6E6A;
    --teal-deep:#155450;
    --teal-pale:#E1F0EE;
    --seal:#C2382C;
    --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    --word:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  .top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 6px}
  .brand{font-weight:700;font-size:17px;letter-spacing:-0.01em}
  .status{font-size:13px;color:var(--ink-2)}

  main{flex:1;padding:8px 16px calc(84px + env(safe-area-inset-bottom))}
  section.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 16px}
  .center{text-align:center}
  .muted{color:var(--ink-2)}
  .small{font-size:13px}
  .gap{height:12px}
  .gap-l{height:22px}
  h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--ink-2)}

  /* ruled notebook hero */
  .sheet{position:relative;margin:6px auto 0;padding:26px 12px 14px;background:
    repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
    border-radius:4px}
  .word{font-family:var(--word);font-size:44px;line-height:1.15;letter-spacing:0.005em;color:var(--ink);word-break:break-word}
  .word.sm{font-size:30px}
  .word-inline{font-family:var(--word);font-size:1.15em}
  .meaning{font-size:20px;font-weight:600;margin-top:12px}
  .example{color:var(--ink-2);margin-top:8px;font-size:15px}
  .example .word-inline{color:var(--ink);font-size:1.05em}
  .prompt-mean{font-size:26px;font-weight:600;margin:18px 0 6px}
  .hint{color:var(--ink-3);font-size:14px}

  .btn{display:block;width:100%;height:50px;border-radius:9px;border:1px solid var(--line);background:var(--white);font-weight:600;font-size:16px;margin-top:10px}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:active{background:var(--teal-deep)}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--teal);font-weight:500;height:44px}
  .btn.danger{color:var(--seal);border-color:var(--seal)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:10px}
  .btn.fail{color:var(--seal)}
  .btn.pass{color:var(--teal);border-color:var(--teal)}
  .iconbtn{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--white);font-size:14px;color:var(--ink-2)}

  label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  input[type=text],textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--white);outline:none}
  textarea{height:auto;padding:10px 12px;min-height:110px;line-height:1.5;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-pale)}
  .input-word{font-family:var(--word);font-size:22px;height:56px}
  .field-note{font-size:13px;color:var(--ink-3);margin-top:4px}
  .answer-row{display:flex;gap:8px;margin-top:14px}
  .answer-row input{flex:1;font-size:20px;height:54px;font-family:var(--word)}
  .answer-row .btn{width:auto;padding:0 20px;margin:0;height:54px}

  /* rubber stamp */
  .stamp{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:44px;padding:0 14px;border:3px solid var(--seal);color:var(--seal);border-radius:6px;font-family:var(--word);font-style:italic;font-size:22px;letter-spacing:0.04em;transform:rotate(-6deg);margin:6px 0 6px}
  .stamp.wrong{border-color:var(--ink-3);color:var(--ink-3);transform:rotate(4deg)}
  .verdict{font-weight:600;margin-top:2px}
  .typed{color:var(--ink-3);font-size:17px;text-decoration:line-through;font-family:var(--word)}
  .heard{font-size:14px;color:var(--ink-2);margin:4px 0 2px}
  .heard .word-inline{color:var(--ink)}
  @media (prefers-reduced-motion:no-preference){
    .stamp.pop{animation:pop .28s ease-out}
    @keyframes pop{from{transform:rotate(-6deg) scale(1.5);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
    .stamp.wrong.pop{animation:popw .28s ease-out}
    @keyframes popw{from{transform:rotate(4deg) scale(1.5);opacity:0}to{transform:rotate(4deg) scale(1);opacity:1}}
  }

  .progress{height:4px;background:var(--line);border-radius:2px;margin:0 2px 14px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--teal);border-radius:2px}

  /* word list */
  .search{margin-bottom:10px}
  .wlist{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .witem{border-top:1px solid var(--line)}
  .witem:first-child{border-top:0}
  .whead{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
  .wword{font-family:var(--word);font-size:20px;flex:1;min-width:0;line-height:1.2}
  .wword div{font-family:var(--ui);font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .wdue{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .wbody{padding:0 14px 14px;font-size:14px;color:var(--ink-2)}
  .wbody .row .btn{height:42px;font-size:14px;font-weight:500}
  .stagebar{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
  .stagebar i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .stagebar i.on{background:var(--teal)}

  .radio{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .radio:first-of-type{border-top:0}
  .radio input{width:20px;height:20px;margin:0}
  .radio div{flex:1}
  .radio .small{display:block}

  .dict{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--white)}
  .dict.warn{border-left-color:var(--seal)}
  .dict.wait{border-left-color:var(--line);color:var(--ink-3)}
  .dict h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .dict .pos{color:var(--ink-3);font-size:12px;margin-right:6px}
  .dict .def{margin:2px 0}
  .dict .row .btn{height:42px;font-size:14px}
  .gloss{font-size:14px;color:var(--ink-2);margin-top:6px}
  .wflag{display:inline-block;font-size:11px;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 5px;line-height:16px;margin-bottom:3px}
  .wrow{display:flex;align-items:center}
  .wrow .whead{flex:1;min-width:0;padding-left:6px}
  .wcheck{display:flex;align-items:center;justify-content:center;width:44px;align-self:stretch;margin:0;padding-left:8px;cursor:pointer}
  .wcheck input{width:20px;height:20px;margin:0;accent-color:var(--teal)}
  .focusbar{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .focusbar .fhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--white);font-size:13px;color:var(--ink-2)}
  .chip.on{border-color:var(--teal);color:var(--teal)}
  .chip:disabled{opacity:.45}
  .focusbar .btn{height:44px;font-size:15px}
  select{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--white);font-size:15px}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-2)}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs div{display:flex;width:100%;max-width:480px}
  .tabs button{flex:1;height:58px;border:0;background:none;color:var(--ink-3);font-size:14px;font-weight:600;position:relative}
  .tabs button.on{color:var(--teal)}
  .tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--teal);border-radius:0 0 3px 3px}
  .tabs button b[hidden]{display:none}
  .tabs button b{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;border-radius:9px;background:var(--seal);color:#fff;font-size:11px;margin-left:4px;vertical-align:1px}

  #toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  .banner{background:#F9E9E6;color:var(--seal);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
  .link{background:none;border:0;color:var(--teal);padding:6px 0;text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">말레이어 단어장</div>
    <div class="status" id="status"></div>
  </header>
  <main id="view"><div class="empty">불러오는 중</div></main>
  <nav class="tabs" aria-label="메뉴"><div>
    <button data-tab="review">복습<b id="badge" hidden></b></button>
    <button data-tab="add">추가</button>
    <button data-tab="list">단어장</button>
    <button data-tab="settings">설정</button>
  </div></nav>
  <div id="toast" role="status"></div>
</div>

<script>
(function(){
'use strict';
const KEY = 'msvocab_v1';
const APP_VERSION = '2026-09-29 v3 (집중 복습·음성 선택)';
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];
let S = null;
let storageOK = false;
let storageInfo = { personal:false, shared:false, lastSave:0, lastError:'' };
const sync = { url:'', es:null, connected:false, status:'', lastSync:0, lastError:'', pollTimer:null, refetch:null, visBound:false };
const inIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let saveTimer = null, saveRetries = 0;
let tab = 'review';
let session = { active:false, finished:false, extra:false, queue:[], cur:null, type:null, revealed:false, pending:null, done:0, ok:0 };
let listState = { q:'', open:null, edit:null, focusOnly:false };
let addState = { bulk:false };
let confirmDelete = null;

// ---------- helpers ----------
const $ = (s, r) => (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800); }
function relTime(ts){
  const diff = ts - Date.now();
  if (diff <= 0) return '지금';
  const m = Math.round(diff/60000); if (m < 60) return `${m}분 후`;
  const h = Math.round(diff/3600000); if (h < 24) return `${h}시간 후`;
  const d = Math.round(diff/DAY); return d === 1 ? '내일' : `${d}일 후`;
}
// 말레이어 답 비교용 정규화: 소문자, 앞뒤 공백, 연속 공백, 문장부호(하이픈·아포스트로피는 유지)
const norm = s => String(s||'').toLowerCase().replace(/[^\p{L}\p{N}\s'\-]/gu, ' ').replace(/\s+/g, ' ').trim();
function editDistance(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n+1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}

// ---------- storage ----------
function fresh(){ return { version:1, words:[], log:{}, settings:{ mode:'mix', autoAudio:true, speakCards:true, listenCards:true } }; }
function waitForStorage(ms){
  return new Promise(res => { const t0 = Date.now(); (function poll(){
    if (window.storage && window.storage.get) return res(true);
    if (Date.now() - t0 > ms) return res(false);
    setTimeout(poll, 100); })(); });
}
async function readStore(shared){
  try { const r = await window.storage.get(KEY, shared); if (r && r.value) { const d = JSON.parse(r.value); if (d && Array.isArray(d.words)) return d; } } catch (e) {}
  return null;
}
function mergeStates(a, b){
  if (!a && !b) return null; if (!a) return b; if (!b) return a;
  const map = new Map();
  for (const w of [...(a.words||[]), ...(b.words||[])]) {
    const k = norm(w.word); if (!k) continue;
    const cur = map.get(k);
    const better = !cur || (w.reps||0) > (cur.reps||0) || ((w.reps||0) === (cur.reps||0) && (w.last||w.added||0) > (cur.last||cur.added||0));
    if (better) map.set(k, w);
  }
  const log = Object.assign({}, a.log||{});
  for (const k in (b.log||{})) log[k] = log[k] ? { n: Math.max(log[k].n||0, b.log[k].n||0), ok: Math.max(log[k].ok||0, b.log[k].ok||0) } : b.log[k];
  const newer = (a.updated||0) >= (b.updated||0) ? a : b;
  return { version:1, words:[...map.values()], log, settings: newer.settings, updated: Date.now() };
}
async function load(){
  sync.url = currentSyncUrl();
  storageOK = await waitForStorage(inIframe ? (sync.url ? 500 : 3000) : 0);
  if (storageOK) {
    const [a, b] = await Promise.all([readStore(false), readStore(true)]);
    storageInfo.personal = !!a; storageInfo.shared = !!b;
    S = mergeStates(a, b);
  }
  if (!S || !Array.isArray(S.words)) S = fresh();
  if (sync.url) {
    try {
      const remote = await syncFetch();
      if (remote && remote.words.length) S = remote;
      else if (S.words.length) await syncPush();
      sync.status = '연결됨';
    } catch (e) { sync.lastError = String(e && e.message || e); sync.status = '연결 실패'; }
  }
  S.settings = Object.assign(fresh().settings, S.settings||{});
  S.log = S.log || {};
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 250); }
async function doSaveSync(){
  if (!sync.url) return;
  try { await syncPush(); } catch (e) { sync.lastError = String(e && e.message || e); toast('동기화 저장 실패: ' + sync.lastError); }
  updateSyncUI();
}
async function doSave(){
  if (!storageOK) storageOK = !!(window.storage && window.storage.get);
  S.updated = Date.now();
  if (sync.url) doSaveSync();
  if (!storageOK) return;
  const payload = JSON.stringify(S);
  try {
    const r = await window.storage.set(KEY, payload, false);
    if (!r) throw new Error('empty');
    saveRetries = 0; storageInfo.lastSave = Date.now(); storageInfo.lastError = '';
  } catch (e) {
    storageInfo.lastError = String(e && e.message || e);
    if (saveRetries < 3) { saveRetries++; setTimeout(doSave, 2500); return; }
    toast('저장하지 못했어요. 설정에서 내보내기로 백업해 두세요.'); saveRetries = 0;
  }
  try { await window.storage.set(KEY, payload, true); } catch (e) {}
}

// ---------- 기기 간 동기화 (Firebase Realtime Database REST) ----------
const isFirebaseUrl = u => /firebasedatabase\.app|firebaseio\.com/.test(u || '');
function randKey(){
  const a = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let out = '';
  const r = new Uint32Array(28);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(r); else for (let i = 0; i < 28; i++) r[i] = Math.floor(Math.random()*4e9);
  for (let i = 0; i < 28; i++) out += a[r[i] % a.length];
  return out;
}
function normalizeSyncUrl(input){
  let u = String(input || '').trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const x = new URL(u);
    if (isFirebaseUrl(u)) {
      let path = x.pathname.replace(/\/+$/, '').replace(/\.json$/, '');
      if (!path || path === '/') path = '/vocab/' + randKey();
      x.pathname = path + '.json'; x.search = ''; x.hash = '';
    }
    return x.toString();
  } catch (e) { return ''; }
}
function currentSyncUrl(){
  const m = (location.hash || '').match(/sync=([^&]+)/);
  if (m) { try { return normalizeSyncUrl(decodeURIComponent(m[1])); } catch (e) {} }
  return normalizeSyncUrl(window.SYNC_URL_DEFAULT || '');
}
function rememberSyncUrl(u){
  try {
    const h = u ? '#sync=' + encodeURIComponent(u) : '';
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + h); else location.hash = h;
  } catch (e) {}
}
function normalizeState(d){
  if (!d || typeof d !== 'object') return null;
  d.words = Array.isArray(d.words) ? d.words : (d.words ? Object.values(d.words) : []);
  d.words = d.words.filter(w => w && w.word);
  d.log = d.log || {}; d.settings = Object.assign(fresh().settings, d.settings || {}); d.version = 1;
  return d;
}
async function syncFetch(){
  const res = await fetch(sync.url, { cache:'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return normalizeState(await res.json());
}
async function syncPush(){
  if (!sync.url) return;
  const res = await fetch(sync.url, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(S) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  sync.lastSync = Date.now(); sync.lastError = '';
}
function applyRemote(d){
  d = normalizeState(d);
  if (!d) { if (S.words.length) doSaveSync(); return; }
  if (d.updated && S.updated && d.updated === S.updated) return;
  S = d;
  if (session.active && session.cur) {
    const w = S.words.find(x => x.id === session.cur.id);
    if (w) session.cur = w; else { session.queue = session.queue.filter(id => S.words.some(x => x.id === id)); nextCard(); }
  } else if (session.queue && session.queue.length) session.queue = session.queue.filter(id => S.words.some(x => x.id === id));
  setStatus();
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (tab === 'list' || (tab === 'review' && !typing)) render();
  if (storageOK) { try { window.storage.set(KEY, JSON.stringify(S), false); } catch (e) {} }
}
function refetchSoon(){
  clearTimeout(sync.refetch);
  sync.refetch = setTimeout(async () => {
    if (!sync.url) return;
    try { applyRemote(await syncFetch()); sync.lastSync = Date.now(); sync.lastError = ''; }
    catch (e) { sync.lastError = String(e && e.message || e); }
    updateSyncUI();
  }, 300);
}
function syncDisconnect(){
  if (sync.es) { try { sync.es.close(); } catch (e) {} sync.es = null; }
  clearInterval(sync.pollTimer); sync.pollTimer = null; sync.connected = false;
}
function syncConnect(){
  syncDisconnect();
  if (!sync.url) return;
  if (isFirebaseUrl(sync.url) && 'EventSource' in window) {
    try {
      const es = new EventSource(sync.url); sync.es = es;
      es.onopen = () => { sync.connected = true; sync.status = '실시간 연결됨'; updateSyncUI(); };
      es.onerror = () => { sync.connected = false; sync.status = '재연결 중…'; updateSyncUI(); };
      es.addEventListener('put', e => {
        try { const m = JSON.parse(e.data); if (m.path === '/') applyRemote(m.data); else refetchSoon(); } catch (x) {}
        sync.connected = true; sync.status = '실시간 연결됨'; sync.lastSync = Date.now(); updateSyncUI();
      });
      es.addEventListener('patch', () => refetchSoon());
      es.addEventListener('cancel', () => { sync.connected = false; sync.status = '권한 거부 — Firebase 규칙을 확인하세요'; updateSyncUI(); });
      es.addEventListener('auth_revoked', () => { sync.connected = false; sync.status = '인증 만료'; updateSyncUI(); });
    } catch (e) { startPolling(); }
  } else startPolling();
  if (!sync.visBound) {
    sync.visBound = true;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !sync.url) return;
      if (sync.es && sync.es.readyState === 2) syncConnect(); else refetchSoon();
    });
  }
}
function startPolling(){ clearInterval(sync.pollTimer); sync.pollTimer = setInterval(refetchSoon, 20000); sync.status = '20초마다 동기화'; sync.connected = true; updateSyncUI(); }
async function connectSync(input){
  const u = normalizeSyncUrl(input);
  if (!u) { toast('주소 형식을 확인해 주세요'); return; }
  syncDisconnect(); sync.url = u; sync.lastError = ''; sync.status = '연결 중…'; updateSyncUI();
  try {
    const remote = await syncFetch();
    if (remote && remote.words.length) { S = S.words.length ? mergeStates(S, remote) : remote; await syncPush(); }
    else if (S.words.length) await syncPush();
    rememberSyncUrl(u); syncConnect(); if (sync.status === '연결 중…') sync.status = '연결됨';
    toast(`동기화 연결됨 — ${S.words.length}단어`); save();
  } catch (e) { sync.lastError = String(e && e.message || e); sync.status = '연결 실패'; toast('연결 실패: ' + sync.lastError); }
  render();
}
function disconnectSync(){ syncDisconnect(); sync.url = ''; sync.status = ''; sync.lastError = ''; rememberSyncUrl(''); toast('동기화를 해제했어요'); render(); }
function syncStatusText(){
  if (!sync.url) return '동기화 안 함 — 이 기기(또는 이 저장소)에만 저장돼요.';
  const t = sync.lastSync ? ` · 마지막 동기화 ${new Date(sync.lastSync).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })}` : '';
  return (sync.status || '연결 중…') + t + (sync.lastError ? ` · 오류: ${sync.lastError}` : '');
}
function updateSyncUI(){ const el = $('#syncStatus'); if (el) el.textContent = syncStatusText(); setStatus(); }

// ---------- 음성: TTS(말레이어, 없으면 인도네시아어) / 음성 인식 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const speechOK = !!SR;
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
const ttsBase = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
if (ttsBase) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
const DEFAULT_RATE = 0.85;
const TEST_TEXT = 'Selamat pagi. Terima kasih banyak, saya suka makan nasi lemak.';
function langVoices(){ return voices.filter(v => /^(ms|id|in)[-_]?/i.test(v.lang)); }
function autoVoice(){ return voices.find(v => /^ms/i.test(v.lang)) || voices.find(v => /^(id|in)/i.test(v.lang)) || null; }
function pickVoice(){ const c = S && S.settings && S.settings.voice ? voices.find(x => x.voiceURI === S.settings.voice) : null; return c || autoVoice(); }
function voiceOptionsHtml(){
  const list = langVoices();
  const auto = autoVoice();
  const cur = S.settings.voice || '';
  if (!list.length) return `<option value="">자동 (기기 기본 음성)</option>`;
  return `<option value="" ${cur ? '' : 'selected'}>자동 — ${esc(auto ? auto.name + ' (' + auto.lang + ')' : '기기 기본')}</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}" ${cur === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})${v.localService === false ? ' · 온라인' : ''}</option>`).join('');
}

function ttsOK(){ return ttsBase && (!voices.length || !!pickVoice()); }   // 목소리 목록이 아직 없으면 일단 시도
function speak(text){
  if (!ttsBase) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'ms-MY';
    u.rate = (S && S.settings && S.settings.rate) || DEFAULT_RATE;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- 위키낱말사전(en.wiktionary) 조회 ----------
const WIKT = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
const dictCache = new Map();
let dictTimer = null, dictLast = null;   // dictLast: 마지막 조회 {key, result}
const stripHtml = h => String(h||'').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
async function lookupWord(word){
  const key = norm(word);
  if (dictCache.has(key)) return dictCache.get(key);
  const one = async term => {
    const res = await fetch(WIKT + encodeURIComponent(term.replace(/\s+/g, '_')));
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  };
  let data = null;
  try {
    const t = word.trim();
    data = await one(t);
    if (!data && t !== t.toLowerCase()) data = await one(t.toLowerCase());
  } catch (e) { return { error: String(e && e.message || e) }; }
  const pick = lang => (data && Array.isArray(data[lang])) ? data[lang].map(g => ({ pos: g.partOfSpeech || '', defs: (g.definitions||[]).map(d => stripHtml(d.definition)).filter(Boolean).slice(0, 3) })).filter(g => g.defs.length) : [];
  const ms = pick('ms'), id = pick('id');
  const r = { found: ms.length > 0, idOnly: !ms.length && id.length > 0, groups: ms.length ? ms : id, others: data ? Object.keys(data).filter(k => k !== 'ms' && k !== 'id') : [] };
  dictCache.set(key, r); return r;
}
function glossOf(r){ return r && r.groups && r.groups.length ? r.groups[0].defs[0].slice(0, 80) : ''; }
function dictHtml(word, r, buttons){
  const link = `<a class="link" href="https://en.wiktionary.org/wiki/${encodeURIComponent(word.trim().replace(/\s+/g, '_'))}#Malay" target="_blank" rel="noopener">사전 페이지 열기</a>`;
  if (!r) return '';
  if (r.wait) return `<div class="dict wait">위키낱말사전에서 확인하는 중…</div>`;
  if (r.error) return `<div class="dict wait">사전에 연결하지 못했어요 (${esc(r.error)}). 확인 없이 저장할 수 있어요.${buttons || ''}</div>`;
  if (r.found || r.idOnly) {
    return `<div class="dict"><h3>위키낱말사전${r.idOnly ? ' — 말레이어 항목은 없고 인도네시아어 항목이 있어요 (철자·뜻은 대개 같아요)' : ''}</h3>
      ${r.groups.slice(0, 2).map(g => g.defs.map(d => `<div class="def"><span class="pos">${esc(g.pos)}</span>${esc(d)}</div>`).join('')).join('')}
      ${link}${buttons || ''}</div>`;
  }
  return `<div class="dict warn"><h3>위키낱말사전에 말레이어 항목이 없어요</h3>
    <div class="def">철자를 확인해 주세요. ${r.others.length ? `다른 언어(${esc(r.others.slice(0,3).join(', '))}) 항목만 있어요. ` : ''}접사가 붙은 형태(memakan, makanan…), 구어체, 신조어는 사전에 없을 수 있어요.</div>
    ${link}${buttons || ''}</div>`;
}
function scheduleDictLookup(){
  clearTimeout(dictTimer);
  const box = $('#dictbox'); const wi = $('#word'); if (!box || !wi) return;
  const word = wi.value.trim();
  if (word.length < 3) { box.innerHTML = ''; dictLast = null; return; }
  dictTimer = setTimeout(async () => {
    box.innerHTML = dictHtml(word, { wait:true });
    const r = await lookupWord(word);
    const now = $('#word'); if (!now || now.value.trim() !== word) return;   // 그 사이 바뀜
    dictLast = { key: norm(word), result: r };
    box.innerHTML = dictHtml(word, r);
  }, 700);
}

// ---------- words ----------
function findByWord(word){ const k = norm(word); return S.words.find(w => norm(w.word) === k); }
function addWord({word, mean, ex}){
  const w = { id: uid(), word: word.trim(), mean: mean.trim(), ex: (ex||'').trim(), added: Date.now(), stage: 0, due: Date.now(), reps: 0, lapses: 0, last: 0 };
  if (arguments[0].gloss) w.gloss = arguments[0].gloss;
  if (arguments[0].dict) w.dict = arguments[0].dict;
  S.words.push(w); return w;
}
function dueCards(){ const now = Date.now(); return S.words.filter(w => w.due <= now).sort((a,b) => a.due - b.due); }
function logToday(ok){ const k = today(); const l = S.log[k] || (S.log[k] = { n:0, ok:0 }); l.n++; if (ok) l.ok++; }
function applyGrade(w, result, extra){
  const now = Date.now();
  w.reps = (w.reps||0) + 1; w.last = now;
  if (result === 'fail') { w.lapses = (w.lapses||0) + 1; w.stage = 0; w.due = now + 10*60000; }
  else if (!extra) {
    if (result === 'hard') { w.due = now + DAY; }
    else { w.stage = Math.min(INTERVALS.length-1, (w.stage||0) + 1); w.due = now + INTERVALS[w.stage]*DAY; }
  }
  logToday(result !== 'fail');
  save();
}
function stagebar(stage){ return `<span class="stagebar">${INTERVALS.map((_,i)=>`<i class="${i<=stage&&stage>0?'on':''}"></i>`).join('')}</span>`; }
const sheet = (text, small) => `<div class="sheet"><div class="word ${small ? 'sm' : ''}">${esc(text)}</div></div>`;

// ---------- session ----------
function startSession(extra){
  let cards;
  if (extra === 'focus') cards = shuffle(focusWords());
  else { cards = dueCards(); if (extra) cards = shuffle(S.words.slice()).slice(0, 10); }
  if (!cards.length) { session.active = false; return false; }
  const now0 = Date.now(), dueSet = new Set(cards.filter(w => w.due <= now0).map(w => w.id));
  session = { active:true, finished:false, extra: !!extra, focus: extra === 'focus', dueSet, queue: cards.map(w => w.id), cur:null, type:null, revealed:false, pending:null, done:0, ok:0 };
  nextCard();
  return true;
}
function pickType(w){
  const m = S.settings.mode;
  const canListen = ttsOK() && S.settings.listenCards !== false;
  const canSpeak = speechOK && S.settings.speakCards !== false;
  if (m === 'listen') return ttsOK() ? 'listen' : 'type';
  if (m === 'speak') return speechOK ? 'speak' : 'recog';
  if (m !== 'mix') return m;
  if (!w.reps) return 'recog';
  const pool = ['recog', 'type', 'type'];
  if (canListen) pool.push('listen');
  if (canSpeak) pool.push('speak');
  return pool[Math.floor(Math.random() * pool.length)];
}
function nextCard(){
  session.revealed = false; session.pending = null; session.spoken = false;
  session.attempts = 0; session.listening = false; session.speakMsg = ''; session.hint = false;
  if (session.rec) { try { session.rec.abort(); } catch (e) {} session.rec = null; }
  while (session.queue.length) {
    const id = session.queue.shift();
    const w = S.words.find(x => x.id === id);
    if (w) { session.cur = w; session.type = pickType(w); return; }
  }
  session.cur = null; session.finished = true; session.active = false;
}
function finishCard(result){
  const w = session.cur;
  applyGrade(w, result, session.extra && !(session.dueSet && session.dueSet.has(w.id)));
  session.done++; if (result !== 'fail') session.ok++;
  if (result === 'fail') session.queue.push(w.id);
  nextCard();
  render();
}

// ---------- render ----------
function setStatus(){
  const due = dueCards().length;

  $('#status').textContent = S.words.length ? `총 ${S.words.length}단어, 오늘 ${l.n}개 복습${syncTxt}` : (sync.url ? syncTxt.slice(2) : '');

function nextDueText(){

}

function renderReview(v){

      <p style="margin-top:18px">아직 단어가 없어요.<br>새 단어를 추가하면 여기서 바로 복습할 수 있어요.</p>

      <p class="muted small">${dueCards().length ? `대기 카드가 ${dueCards().length}개 더 있어요.` : `다음 복습은 ${nextDueText()}.`}</p>

  }

  const w = session.cur, t = session.type, p = session.pending;

  const audio = ttsOK() ? `<button class="iconbtn" data-act="speak" aria-label="발음 듣기">듣기</button>` : '';
  const answerBlock = (showWord) => `
    ${showWord ? sheet(w.word) : ''}
    <div class="meaning">${esc(w.mean)}</div>

  const resultView = (extraTop, extraButtons) => `<section class="card center">

    } else {

        `${!p.gaveUp ? `<button class="btn" data-act="listen">다시 말하기</button>` : ''}
         ${p.result === 'fail' && !p.gaveUp ? `<button class="link" data-act="override">인식이 잘못됐어요, 맞은 것으로 처리</button>` : ''}`);

  if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); } }); }
  if (t === 'listen' && !p && !session.spoken) { session.spoken = true; speak(w.word); }
  if (p && S.settings.autoAudio && !p.spoken) { p.spoken = true; speak(w.word); }
  if (t === 'recog' && session.revealed && S.settings.autoAudio && !session.spoken) { session.spoken = true; speak(w.word); }
}
function checkAnswer(){
  const inp = $('#ans'); if (!inp) return;
  const typed = inp.value.trim();
  if (!typed) { inp.focus(); return; }
  const a = norm(typed), b = norm(session.cur.word);
  const ok = a === b;
  const near = !ok && b.length >= 5 && editDistance(a, b) === 1;   // 한 글자 차이는 맞은 것으로, 철자 확인 표시
  session.pending = { result: ok || near ? 'pass' : 'fail', typed, near, gaveUp:false };
  render();
}
function startListening(){
  if (!speechOK || !session.cur) return;
  try { if (ttsBase) speechSynthesis.cancel(); } catch (e) {}
  try {
    const r = new SR(); r.lang = 'ms-MY'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    session.rec = r; session.listening = true; session.pending = null; session.speakMsg = ''; render();
    let got = false;
    r.onresult = e => {
      got = true; const alts = [];
      for (let i = 0; i < e.results.length; i++) { const res = e.results[i]; for (let j = 0; j < res.length; j++) alts.push(res[j].transcript); }
      session.listening = false; session.attempts++; session.pending = judgeSpeech(session.cur, alts); render();
    };
    r.onerror = e => {
      session.listening = false; const code = e && e.error;
      session.speakMsg = code === 'not-allowed' || code === 'service-not-allowed' ? '마이크 권한을 허용해 주세요.' : code === 'no-speech' ? '소리를 잡지 못했어요. 다시 말해 보세요.' : code === 'network' ? '음성 인식 서버에 연결하지 못했어요.' : code === 'language-not-supported' ? '이 기기는 말레이어 음성 인식을 지원하지 않아요.' : '인식 오류가 났어요. 다시 시도해 주세요.';
      render();
    };
    r.onend = () => { if (session.listening) { session.listening = false; if (!got) session.speakMsg = '소리를 잡지 못했어요. 다시 말해 보세요.'; render(); } };
    r.start();
  } catch (e) { session.listening = false; session.speakMsg = '이 브라우저에서는 음성 인식을 쓸 수 없어요.'; render(); }
}
function judgeSpeech(w, alts){
  const target = norm(w.word);
  let best = null;
  for (const raw of alts) {
    const heard = norm(raw); if (!heard) continue;
    const words = heard.split(' ');
    const exact = heard === target || (target.includes(' ') ? heard.includes(target) : words.includes(target));
    const near = !exact && target.length >= 5 && Math.min(...words.map(x => editDistance(x, target)), editDistance(heard, target)) <= 1;
    const score = exact ? 2 : near ? 1 : 0;
    if (!best || score > best.score) best = { score, heard: String(raw).trim() };
    if (score === 2) break;
  }
  if (!best) return { result:'fail', heard:'', gaveUp:false };
  return { result: best.score >= 1 ? 'pass' : 'fail', near: best.score === 1, heard: best.heard, gaveUp:false };
}

let saving = false;

  ['word','mean','ex'].forEach(id => { $('#'+id).value = ''; });
  if (box) box.innerHTML = r && !r.error ? dictHtml(word, r) : '';

function parseLines(raw){
  let added = 0, skipped = 0, bad = 0;
  raw.split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/\t|,|，/).map(x => x.trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) { bad++; return; }
    const [word, mean, ...rest] = parts;
    if (findByWord(word)) { skipped++; return; }
    addWord({ word, mean, ex: rest.join(', ') }); added++;
  });
  return { added, skipped, bad };
}

}

  $('#rateSel').addEventListener('change', e => { S.settings.rate = +e.target.value; save(); speak(TEST_TEXT); });
  $('#listenCards').addEventListener('change', e => { S.settings.listenCards = e.target.checked; save(); });
  $('#speakCards').addEventListener('change', e => { S.settings.speakCards = e.target.checked; save(); });
}
function exportTsv(){ $('#io').value = S.words.map(w => [w.word, w.mean, w.ex||''].join('\t')).join('\n'); toast('탭으로 구분된 단어 목록을 만들었어요'); }
function exportJson(){ $('#io').value = JSON.stringify(S); toast('학습 기록을 포함한 백업을 만들었어요'); }
async function copyIo(){
  const t = $('#io'); if (!t.value) { toast('먼저 내보내기를 눌러 주세요'); return; }
  try { await navigator.clipboard.writeText(t.value); toast('복사했어요'); }
  catch (e) { t.focus(); t.select(); toast('길게 눌러 복사하세요'); }
}
function importIo(){
  const raw = $('#io').value.trim(); if (!raw) { toast('가져올 내용을 붙여 넣어 주세요'); return; }
  if (raw[0] === '{') {
    try {
      const d = JSON.parse(raw);
      if (!Array.isArray(d.words)) throw 0;
      let added = 0, updated = 0;
      d.words.forEach(w => {
        if (!(w.word && w.mean)) return;
        const cur = findByWord(w.word);
        if (!cur) { S.words.push(Object.assign({ id: uid(), added: Date.now(), stage:0, due: Date.now(), reps:0, lapses:0, last:0, ex:'' }, w)); added++; }
        else if ((w.reps||0) > (cur.reps||0)) { Object.assign(cur, { stage:w.stage, due:w.due, reps:w.reps, lapses:w.lapses, last:w.last }); updated++; }
      });
      if (d.log) Object.keys(d.log).forEach(k => { if (!S.log[k]) S.log[k] = d.log[k]; });
      save(); toast(`${added}개 단어를 가져왔어요${updated ? `, ${updated}개는 복습 기록을 최신으로 맞췼어요` : ''}`); setStatus(); return;
    } catch (e) { toast('백업 형식을 읽을 수 없어요'); return; }
  }
  const r = parseLines(raw);
  if (r.added) save();
  toast(`${r.added}개 저장${r.skipped ? `, ${r.skipped}개 중복` : ''}${r.bad ? `, ${r.bad}줄 오류` : ''}`); setStatus();
}

async function dictCheckAll(){
  const btn = $('#dictAll'); const prog = $('#dictProgress');
  const todo = S.words.filter(w => !w.dict); if (!todo.length) return;
  if (btn) btn.disabled = true;
  let done = 0, missing = 0, errors = 0;
  for (const w of todo) {
    const r = await lookupWord(w.word);
    if (r.error) errors++; else { w.dict = r.found ? 'ok' : (r.idOnly ? 'id' : 'none'); const g = glossOf(r); if (g) w.gloss = g; if (w.dict === 'none') missing++; }
    done++; if (prog) prog.textContent = `${done}/${todo.length} 확인 중…`;
    await new Promise(res => setTimeout(res, 150));
  }
  save();
  if (prog) prog.textContent = `완료 — 사전에 없는 단어 ${missing}개${errors ? `, 연결 실패 ${errors}개` : ''}. 단어장 탭에서 '사전 확인' 표시를 보세요.`;
  toast(`${done}개 점검 완료`);
}

// ---------- events ----------
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; confirmDelete = null; render();
});
$('#view').addEventListener('change', e => {
  const f = e.target.closest('input[data-focus]');
  if (f) { const w = S.words.find(x => x.id === f.dataset.focus); if (w) { if (f.checked) w.focus = true; else delete w.focus; save(); updateFocusBar(); } return; }
  const nw = e.target.closest('input[data-nowrite]');
  if (nw) { const w = S.words.find(x => x.id === nw.dataset.nowrite); if (w) { if (nw.checked) w.noWrite = true; else delete w.noWrite; save(); toast(nw.checked ? '이 단어는 손글씨 대신 병음 입력으로 복습해요' : '손글씨 카드에 다시 포함했어요'); } }
});
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-grade],[data-go],[data-open],[data-edit],[data-del],[data-save],[data-speak]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { tab = d.go; render(); return; }
  if (d.grade) { finishCard(d.grade); return; }
  if (d.speak) { const w = S.words.find(x => x.id === d.speak); if (w) speak(w.word); return; }
  if (d.open) { listState.open = listState.open === d.open ? null : d.open; listState.edit = null; confirmDelete = null; refreshList(); return; }
  if (d.edit) { listState.edit = d.edit; refreshList(); return; }
  if (d.del) {
    if (confirmDelete !== d.del) { confirmDelete = d.del; refreshList(); return; }
    S.words = S.words.filter(w => w.id !== d.del); confirmDelete = null; listState.open = null; save(); toast('삭제했어요'); render(); return;
  }
  if (d.save) {
    const w = S.words.find(x => x.id === d.save); if (!w) return;
    const word = $('#e-word').value.trim(), mean = $('#e-mean').value.trim(), ex = $('#e-ex').value.trim();
    if (!word || !mean) { toast('단어와 뜻을 확인해 주세요'); return; }
    const dup = findByWord(word); if (dup && dup.id !== w.id) { toast('같은 단어가 이미 있어요'); return; }
    if (norm(word) !== norm(w.word)) { delete w.dict; delete w.gloss; }
    Object.assign(w, { word, mean, ex }); save(); listState.edit = null; toast('수정했어요'); refreshList(); return;
  }
  switch (d.act) {
    case 'reveal': session.revealed = true; session.spoken = false; render(); break;
    case 'speak': speak(session.cur.word); break;
    case 'check': checkAnswer(); break;
    case 'giveup': session.pending = { result:'fail', typed:'', gaveUp:true }; render(); break;
    case 'override': session.pending.result = 'pass'; session.pending.near = false; render(); break;
    case 'next': finishCard(session.pending.result); break;
    case 'hint': session.hint = true; { const el = $('#whint'); if (el && session.cur) el.textContent = session.cur.mean; } break;
    case 'listen': startListening(); break;
    case 'start': startSession(false); render(); break;
    case 'startFocus': if (!focusWords().length) { toast('체크한 단어가 없어요'); break; } tab = 'review'; startSession('focus'); render(); break;
    case 'focusRecent': focusAdd(S.words.slice().sort((a,b) => b.added - a.added).slice(0, 20), '최근 등록'); break;
    case 'focusMissed': { const m = S.words.filter(w => (w.lapses||0) > 0).sort((a,b) => (b.lapses||0) - (a.lapses||0) || (b.last||0) - (a.last||0)).slice(0, 20); if (!m.length) { toast('아직 틀린 단어가 없어요'); break; } focusAdd(m, '많이 틀린 단어'); break; }
    case 'focusClear': S.words.forEach(w => { delete w.focus; }); save(); refreshList(); toast('체크를 모두 해제했어요'); break;
    case 'focusOnly': listState.focusOnly = !listState.focusOnly; listState.open = null; refreshList(); break;
    case 'extra': if (!startSession(true)) toast('복습할 단어가 없어요'); render(); break;
    case 'toggleBulk': addState.bulk = !addState.bulk; render(); break;
    case 'saveOne': saveOne(false); break;
    case 'saveAnyway': saveOne(true); break;
    case 'fixWord': { const wi = $('#word'); if (wi) { wi.focus(); wi.select(); } break; }
    case 'dictAll': dictCheckAll(); break;
    case 'saveBulk': saveBulk(); break;
    case 'cancelEdit': listState.edit = null; refreshList(); break;
    case 'syncOn': connectSync($('#syncUrl').value); break;
    case 'syncOff': disconnectSync(); break;
    case 'copySync': (async () => { try { await navigator.clipboard.writeText(sync.url); toast('주소를 복사했어요'); } catch (e) { const i = $('#syncUrl'); if (i) { i.focus(); i.select(); } toast('길게 눌러 복사하세요'); } })(); break;
    case 'testVoice': speak(TEST_TEXT); break;
    case 'exportTsv': exportTsv(); break;
    case 'exportJson': exportJson(); break;
    case 'copy': copyIo(); break;
    case 'import': importIo(); break;
    case 'wipe':
      if (confirmDelete !== '*') { confirmDelete = '*'; render(); return; }
      S.words = []; S.log = {}; confirmDelete = null; session = { active:false, finished:false, queue:[] }; save(); toast('모두 삭제했어요'); render(); break;
  }
});

// ---------- boot ----------
load().then(() => { tab = dueCards().length || !S.words.length ? 'review' : 'add'; render(); if (sync.url) syncConnect(); });
})();
</script>
</body>
</html>
